name: Branch policy

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - run: python3 .github/scripts/check-branch-policy.py --self-test
      - run: python3 .github/scripts/check-branch-policy.py
